name: miamoney
description: "Mia Money — Australian personal & household Finance Assistant."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0

  # Dependency injection
  get_it: ^8.2.0
  injectable: ^2.5.1

  # Navigation
  auto_route: ^10.1.4

  # Responsive sizing
  flutter_screenutil: ^5.9.3

  # Global loader
  flutter_easyloading: ^3.0.5

  # Pagination / pull to refresh
  pull_to_refresh: ^2.0.0

  # Networking (wired for future backend integration)
  dio: ^5.9.0

  # Local storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3

  # Motion & visuals
  flutter_animate: ^4.5.2

  # Charts
  fl_chart: ^1.1.1

  # Device capabilities
  local_auth: ^2.3.0
  image_picker: ^1.2.0
  file_picker: ^10.3.3

  # Utils
  intl: ^0.20.2
  decimal: ^3.2.4
  collection: ^1.19.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.7.1
  freezed: ^3.2.3
  injectable_generator: ^2.9.0
  auto_route_generator: ^10.2.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Regular.ttf
          weight: 400
        - asset: assets/fonts/BricolageGrotesque-Medium.ttf
          weight: 500
        - asset: assets/fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
    - family: Epilogue
      fonts:
        - asset: assets/fonts/Epilogue-Regular.ttf
          weight: 400
        - asset: assets/fonts/Epilogue-Medium.ttf
          weight: 500
        - asset: assets/fonts/Epilogue-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Epilogue-Bold.ttf
          weight: 700
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
          weight: 400
        - asset: assets/fonts/InstrumentSerif-Italic.ttf
          weight: 400
          style: italic
